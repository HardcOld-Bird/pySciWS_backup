[project]
name = "pysci"
version = "0.1.0"
description = "N/A"
readme = "README.md"
# 锁定 Python 精确版本（与项目根目录 .python-version 保持一致）
# uv sync 会自动下载/使用该解释器
requires-python = "==3.13.15"
license = {text = "MIT"}
authors = [
    {name = "HardcOld-Bird", email = "antarcticbird@163.com"}
]

# ------------------------------------------------------------
# 运行时依赖（由 environment.yml 迁移而来）
# ------------------------------------------------------------
dependencies = [
    # 科学计算核心
    "numpy",
    "scipy",
    "sympy",
    # 绘图
    "matplotlib",
    "scienceplots",
    "ultraplot",
    "pyvista",
    # 数据处理 / 校验
    "pandas",
    "pydantic",
    # COMSOL 仿真接口
    "mph",
    # 文献检索与知识库（代码：src/pysci/skills/literature_research/；数据：literature/，详见其 README.md）
    "requests",         # HTTP 客户端（OpenAlex / arXiv / WoS / Zotero）
    "python-dotenv",    # 加载项目根 .env
    "pyzotero",         # Zotero API 官方 Python 封装
    "markdown",         # markdown → HTML（Zotero 笔记写入时需要）
    # PDF → Markdown 抽取（src/pysci/skills/literature_research/tools/pdf_extract.py 使用）
    # 公式精读首选云端 MinerU Open API（仅需 requests，无本地重型依赖）；
    # marker-pdf / magic-pdf 实测本机不可用且云端可替代，已移除。
    "pymupdf4llm",      # 本地兜底后端：纯 CPU，快，但公式会丢失
    "playwright>=1.63.0",  # 付费墙论文抓取：HTML 全文 / 正文 PDF / 补充材料
]

# ------------------------------------------------------------
# 可选依赖组：experiment（gain_ep 实验平台，原 sweeper400）
# 绑定 NI 数据采集硬件，仅 Windows + 安装 NI-DAQmx 驱动后可用；
# 默认不装，保持科研/仿真环境精简。需要时：`uv sync --extra experiment`
# ------------------------------------------------------------
[project.optional-dependencies]
experiment = [
    "nidaqmx",
]

# ------------------------------------------------------------
# 开发依赖组（PEP 735）：uv sync 默认会安装，无需 --extra
# ------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "commitizen",
    "scipy-stubs",   # scipy 类型存根（experiment/analyze 等类型检查用）
]

# ------------------------------------------------------------
# 构建后端：src-layout 单包 pysci（uv sync 以 editable 方式装入 .venv）
# ------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pysci"]

[tool.uv]
# 默认索引指向清华 TUNA 镜像，加速国内下载（如需换回官方源，删除 default = true 即可）
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.urls]
Homepage = "https://github.com/HardcOld-Bird/pySciWS_backup"
Repository = "https://github.com/HardcOld-Bird/pySciWS_backup.git"
Issues = "https://github.com/HardcOld-Bird/pySciWS_backup/issues"

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    ".git/**",
    ".idea/**",
    ".venv/**",
    # 平行资产树：非代码资产（.mph / storage / 参考资料）与 pySweepWS 遗留的 vendored 依赖，
    # 不参与 lint / format
    "my_research/**",
    # 文献缓存（PDF 与抽取产物）
    "literature/cache/**",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
# Configure import sorting
known-first-party = ["pysci"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "0.1.0"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

# ------------------------------------------------------------
# pytest：测试根为 tests/（合并原 sweeper400 的 pytest 配置）
# experiment 硬件用例用 `-m "not hardware"` 过滤；无 nidaqmx / 无 COMSOL Server 时，
# 相关目录由各自 conftest.py 守卫自动跳过收集（tests/gain_ep/experiment、.../theory）。
# 覆盖率不写入 addopts（保持 `uv run pytest` 轻快），需要时显式 `uv run pytest --cov`。
# ------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "hardware: 需要 NI 数据采集硬件 / 步进电机 / COMSOL Server 等外部设备的用例",
    "slow: 运行耗时较长的用例",
]

# ------------------------------------------------------------
# coverage：统计 pysci 包源码覆盖率（原 sweeper400 的 src/sweeper400 → src/pysci）
# ------------------------------------------------------------
[tool.coverage.run]
source = ["src/pysci"]
omit = [
    "*/tests/*",
    "*/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
