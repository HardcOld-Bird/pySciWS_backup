[project]
name = "pysci"
version = "0.1.0"
description = "PySci: a personal, agent-driven research workspace"
requires-python = "==3.13.15"
license = { text = "MIT" }
authors = [
    { name = "HardcOld-Bird", email = "antarcticbird@163.com" },
]

# 运行时依赖从最小集开始；7 个科研技能按三段式选型后逐项添加。
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pysci"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "commitizen",
    "pyyaml",
]

[tool.uv]
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    ".git/**",
    ".idea/**",
    ".venv/**",
    "data/**",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pysci"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "0.1.0"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
testpaths = ["sub_root/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short", "-m", "not hardware"]
markers = [
    "hardware: 需要 NI 数据采集硬件 / 步进电机 / COMSOL Server 等外部设备的用例",
    "slow: 运行耗时较长的用例",
    "network: 需要网络或外部服务的用例",
    "integration: 跨模块集成用例",
]

[tool.coverage.run]
source = ["src/pysci"]
omit = ["*/tests/*", "*/support/evals/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[project.urls]
Homepage = "https://github.com/HardcOld-Bird/pySciWS_backup"
Repository = "https://github.com/HardcOld-Bird/pySciWS_backup.git"
Issues = "https://github.com/HardcOld-Bird/pySciWS_backup/issues"
