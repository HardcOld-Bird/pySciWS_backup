[project]
name = "pysci"
version = "0.1.0"
description = "N/A"
readme = "README.md"
# 锁定 Python 精确版本（与项目根目录 .python-version 保持一致）
# uv sync 会自动下载/使用该解释器
requires-python = "==3.13.15"
license = {text = "MIT"}
authors = [
    {name = "HardcOld-Bird", email = "antarcticbird@163.com"}
]

# ------------------------------------------------------------
# 运行时依赖（由 environment.yml 迁移而来）
# ------------------------------------------------------------
dependencies = [
    # 科学计算核心
    "numpy",
    "scipy",
    "sympy",
    # 绘图
    "matplotlib",
    "scienceplots",
    "ultraplot",
    "pyvista",
    # 数据处理 / 校验
    "pandas",
    "pydantic",
    # COMSOL 仿真接口
    "mph",
    # 文献检索与知识库（代码：src/pysci/skills/literature_research/；数据：data/skills/literature_research/，详见其 README.md）
    "requests",         # HTTP 客户端（OpenAlex / arXiv / WoS / Zotero）
    "python-dotenv",    # 加载项目根 .env
    "pyzotero",         # Zotero API 官方 Python 封装
    "markdown",         # markdown → HTML（Zotero 笔记写入时需要）
    # PDF → Markdown 抽取（src/pysci/skills/literature_research/tools/pdf_extract.py 使用）
    # 公式精读首选云端 MinerU Open API（仅需 requests，无本地重型依赖）；
    # marker-pdf / magic-pdf 实测本机不可用且云端可替代，已移除。
    "pymupdf4llm",      # 本地兜底后端：纯 CPU，快，但公式会丢失
    "playwright>=1.63.0",  # 付费墙论文抓取：HTML 全文 / 正文 PDF / 补充材料
    # 文档写作 skill（src/pysci/skills/document_writing/；数据：data/skills/document_writing/）：
    # markitdown 会带入 onnxruntime/magika 做文件类型识别；LaTeX 编译另需外部 TeX 发行版
    # （TeX Live），非 pip 依赖，须另行安装并加入 PATH。
    "markitdown[pptx]>=0.1.8",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    # gain_ep 实验平台（原 sweeper400）：绑定 NI 数据采集硬件，仅 Windows + 装 NI-DAQmx 驱动后可运行；
    # 包本身跨平台可安装，无驱动时相关用例由 tests/…/conftest.py 守卫自动跳过收集。
    "nidaqmx",
    # 科研绘图 skill（src/pysci/skills/scientific_plotting/；数据：data/skills/scientific_plotting/）：
    # 出版规范层 + 图生产管线骨架。绘图后端复用已声明的 matplotlib/scienceplots/ultraplot/pyvista；
    # pyyaml 用于读取 figures 目录下的 STYLE.yaml 风格绑定（此前仅作为传递依赖存在，此处显式声明）。
    "pyyaml",
]

# ------------------------------------------------------------
# 控制台脚本：三个 skill 的统一 CLI 门面（均为 module:main 形态，main(argv=None)->int）。
# 加前缀 pysci- 避免与全局工具重名；`uv sync` 后在 .venv/Scripts 生成 pysci-*.exe。
# 等价兜底调用：`uv run python -m <入口模块>`（模块路径见各 SKILL.md 的 Invocation）。
# ------------------------------------------------------------
[project.scripts]
pysci-research = "pysci.skills.literature_research.tools.research:main"
pysci-compose = "pysci.skills.document_writing.tools.compose:main"
pysci-simulation = "pysci.skills.comsol_simulation.tools.simulation:main"
pysci-figures = "pysci.skills.scientific_plotting.tools.figures:main"

# ------------------------------------------------------------
# 开发依赖组（PEP 735）：uv sync 默认会安装，无需 --extra
# ------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "commitizen",
    "scipy-stubs",   # scipy 类型存根（experiment/analyze 等类型检查用）
]

# ------------------------------------------------------------
# 构建后端：src-layout 单包 pysci（uv sync 以 editable 方式装入 .venv）
# ------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pysci"]

[tool.uv]
# 默认索引指向清华 TUNA 镜像，加速国内下载（如需换回官方源，删除 default = true 即可）
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.urls]
Homepage = "https://github.com/HardcOld-Bird/pySciWS_backup"
Repository = "https://github.com/HardcOld-Bird/pySciWS_backup.git"
Issues = "https://github.com/HardcOld-Bird/pySciWS_backup/issues"

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    ".git/**",
    ".idea/**",
    ".venv/**",
    # 平行资产树 data/：非代码资产（.mph / storage / 参考资料 / 文献缓存与 PDF），
    # 与 src/pysci 代码树镜像（data/research ↔ research、data/skills ↔ skills），不参与 lint / format
    "data/**",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # Line too long (handled by formatter)
]

# ------------------------------------------------------------
# per-file-ignores：本次重构是“结构迁移”，对迁移进来的既有代码只改包结构与
# import，不重写其代码逻辑与命名风格（camelCase 物理量、既有异常/简化写法等）。
# 故对这些子树豁免“纯风格类”规则；正确性规则（F401/F811/E9 等）与新增代码
# （common/paths）仍保持严格。后续可按子树逐步收紧。
# ------------------------------------------------------------
[tool.ruff.lint.per-file-ignores]
"src/pysci/research/gain_ep/theory/**" = ["N", "SIM", "B", "C4", "E722", "E402", "E731"]
"src/pysci/research/gain_ep/experiment/**" = ["N", "SIM", "B", "C4", "E722", "E402", "E731"]
"src/pysci/skills/**" = ["N", "SIM", "B", "C4", "E722", "E402", "E731"]
"scripts/**" = ["N", "SIM", "B", "C4", "E722", "E402", "E731"]
"tests/**" = ["N", "SIM", "B", "C4", "E722", "E402", "E731", "F841"]
# 既有硬件脚本 exp/ 下含未定义名（历史遗留 bug，待后续单独修复）
"scripts/gain_ep/experiment/exp/**" = ["N", "SIM", "B", "C4", "E722", "E402", "E731", "F821"]

[tool.ruff.lint.isort]
# Configure import sorting
known-first-party = ["pysci"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "0.1.0"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

# ------------------------------------------------------------
# pytest：测试根为 tests/（合并原 sweeper400 的 pytest 配置）
# experiment 硬件用例用 `-m "not hardware"` 过滤；无 nidaqmx / 无 COMSOL Server 时，
# 相关目录由各自 conftest.py 守卫自动跳过收集（tests/gain_ep/experiment、.../theory）。
# 覆盖率不写入 addopts（保持 `uv run pytest` 轻快），需要时显式 `uv run pytest --cov`。
# ------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "hardware: 需要 NI 数据采集硬件 / 步进电机 / COMSOL Server 等外部设备的用例",
    "slow: 运行耗时较长的用例",
]

# ------------------------------------------------------------
# coverage：统计 pysci 包源码覆盖率（原 sweeper400 的 src/sweeper400 → src/pysci）
# ------------------------------------------------------------
[tool.coverage.run]
source = ["src/pysci"]
omit = [
    "*/tests/*",
    "*/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
