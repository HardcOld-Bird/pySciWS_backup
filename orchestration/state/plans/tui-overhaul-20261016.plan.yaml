id: tui-overhaul-20261016
goal: TUI 全面改版一次性交付——任务书按返工家族分组＋Markdown 报告渲染、计划与派发列表+Tree 详情、盲审交互流程（2_REFACTOR §5.4 偏差报告入强制队列）、队列/系统/待决/决策看板卡片化、徽标性能修复（不再全量解析 plan YAML）、footer 与提示文字清理（用户 13 项需求）
read: plan-decomposition.md
steps:
