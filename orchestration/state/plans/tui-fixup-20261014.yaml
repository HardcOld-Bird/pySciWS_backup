  - id: f2
    member: devops
    brief: 美学统一（概览板/详情页/journal/taskbook 面板与主菜单同风格：边框/色彩/背景/标题）+ 用户路径 Pilot 测试（菜单 Enter→详情→footer 广告键位逐一验证）+ 文案一致性测试
