# REFACTOR 收尾补完计划（2026-10-14 用户实测反馈：占位未兑现 + n 键失效 + 美学统一）
goal: TUI 补完（键位修复+模块详情充实+美学统一）+ 过程防再犯（覆盖度对账+用户路径测试纪律）
steps:
  - id: f1
    member: devops
    brief: 交互路径修复（任务书模块 Enter 直达专用面板、footer 键位广告与守卫一致化）+ 五模块详情充实（计划与派发/队列与运行/盲审与审查/待决与验收/系统与路由），消灭「m3 补」式占位
