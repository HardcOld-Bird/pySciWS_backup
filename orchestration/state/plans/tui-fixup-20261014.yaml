  - id: f3
    member: devops
    brief: 过程防再犯：占位/承诺文案中环节 id 必须存在于计划的 taskbook lint 规则 + 用户路径测试纪律写进机械验收/编排操作面 + 组长蓝图条款对账纪律入技能
